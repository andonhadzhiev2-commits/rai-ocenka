<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d0b0c">
<meta name="robots" content="noindex">
<title>РАЙ · Вашето мнение</title>
<link rel="icon" href="/app/icons/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/form/form.css?v=20261124-4">
</head>
<body>
<div class="wrap">
  <header class="head">
    <div class="head-top">
      <img class="logo" src="/form/logo.png" alt="Рай коктейл бар">
      <div class="langs" role="group" aria-label="Език / Language">
        <button type="button" data-lang="bg" aria-pressed="true">BG</button>
        <button type="button" data-lang="en" aria-pressed="false">EN</button>
        <button type="button" data-lang="el" aria-pressed="false">ΕΛ</button>
      </div>
    </div>
    <div class="addr" id="addr"></div>
  </header>

  <div class="notfound" id="notfound" hidden><p data-t="notfound"></p></div>
  <div class="body" id="loading"><p class="sub" data-t="loading"></p></div>

  <form id="form" class="body" novalidate hidden>
    <div>
      <h1 data-t="title"></h1>
      <p class="sub" data-t="lead"></p>
    </div>
    <div>
      <p class="q" data-t="q1"></p>
      <div class="stars" id="stars" role="radiogroup"></div>
      <div class="star-label" id="starLabel"></div>
    </div>
    <div id="step2" hidden>
      <p class="q" id="q2"></p>
      <div class="chips" id="chips"></div>
      <p class="form-multi-hint" id="multiHint"></p>
      <div id="detailsWrap" class="details-wrap" hidden><p class="q" id="detailTitle"></p><p class="form-multi-hint" id="detailHint"></p><div id="details"></div></div>
    </div>
    <div id="step3" hidden>
      <p class="q" data-t="q3"></p>
      <div class="dishes" id="dishes"></div>
    </div>
    <div id="step4" hidden>
      <p class="q"><span data-t="q4"></span> <span class="optional" data-t="opt"></span></p>
      <textarea id="comment" maxlength="1000" data-tp="ph4"></textarea>
      <p class="q" style="margin-top:16px"><span data-t="q5"></span> <span class="optional" data-t="opt"></span></p>
      <input id="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="08… или +359…" maxlength="20">
      <label class="consent"><input id="consent" type="checkbox"> <span><span data-t="gdpr"></span> <a href="/privacy" target="_blank" rel="noopener" data-t="privacy"></a></span></label>
    </div>
    <div class="hp" aria-hidden="true"><label>Website <input id="website" tabindex="-1" autocomplete="off"></label></div>
    <div>
      <button class="btn btn-main" id="send" type="submit" disabled data-t="send"></button>
      <p class="hint" id="hint"></p>
      <p class="err" id="err" role="alert" hidden></p>
    </div>
  </form>

  <div class="body thanks" id="thanks" hidden>
    <div class="big" aria-hidden="true">🍸</div>
    <h1 data-t="ty"></h1>
    <p class="sub" data-t="ty2"></p>
  </div>
  <p class="foot"><a href="/privacy" target="_blank" rel="noopener" data-t="privacy"></a></p>
</div>
<script src="/form/form.js?v=20261124-24"></script>
</body>
</html>
